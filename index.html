(()=>{'use strict';const KEY='creator-studio-v1';const TYPES={'イラスト':['構想','ラフ','線画','着彩','完成'],'ゲーム':['企画','プロトタイプ','実装','テスト','公開'],'Web':['要件定義','デザイン','開発','テスト','公開'],'3DCG':['モデリング','UV','テクスチャ','仕上げ','完成'],'小説':['構想','章立て','執筆','推敲','公開'],'グッズ':['デザイン','入稿','発注','納品','販売'],'映像':['企画','絵コンテ','制作','編集','公開'],'音楽':['構想','作曲','編曲','ミックス','公開'],'その他':['企画','制作','確認','完成']};const $=s=>document.querySelector(s);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');let db=load();db.expenses=Array.isArray(db.expenses)?db.expenses:[];db.timeLogs=Array.isArray(db.timeLogs)?db.timeLogs:[];db.references=Array.isArray(db.references)?db.references:[];let page='dashboard',selected=null,projectQuery='',projectStatus='all',ideaQuery='',taskQuery='',taskSort='manual',taskProject='all',taskState='all',calendarOffset=0,expenseProject='all';function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.projects)&&Array.isArray(d.tasks)&&Array.isArray(d.ideas))return d}catch(e){}return {version:1,projects:[],tasks:[],ideas:[],expenses:[]}}const HISTORY_KEY='creator-studio-history-v11';let undoState=null;function getHistory(){try{const a=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(a)?a:[]}catch{return []}}function save(){try{const next=JSON.stringify(db),previous=localStorage.getItem(KEY);if(previous===next)return;if(previous&&previous.length<1250000){undoState=previous;const history=getHistory();if(!history.length||history[history.length-1].data!==previous){history.push({at:new Date().toISOString(),data:previous});if(history.length>4)history.shift();try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}catch{try{localStorage.removeItem(HISTORY_KEY)}catch{}}}}localStorage.setItem(KEY,next);showUndo()}catch(e){alert('保存できませんでした。ブラウザの空き容量を確認してください。JSONバックアップを保存してください。')}}function showUndo(){const btn=document.getElementById('undoLast');if(btn)btn.hidden=!undoState}function undoLast(){if(!undoState)return;const current=localStorage.getItem(KEY);try{const restored=JSON.parse(undoState);if(!restored||!Array.isArray(restored.projects)||!Array.isArray(restored.tasks))throw Error('invalid');localStorage.setItem(KEY,undoState);db=restored;db.expenses=Array.isArray(db.expenses)?db.expenses:[];db.timeLogs=Array.isArray(db.timeLogs)?db.timeLogs:[];db.references=Array.isArray(db.references)?db.references:[];undoState=current;render();showUndo();toast('直前の変更を取り消しました（もう一度押すと戻せます）')}catch{toast('取り消しに失敗しました')}}function restoreHistory(index){const h=getHistory()[index];if(!h)return;let candidate;try{candidate=JSON.parse(h.data);if(!Array.isArray(candidate.projects)||!Array.isArray(candidate.tasks))throw Error()}catch{return toast('履歴を読み込めません')}if(!confirm('選択した時点のデータに戻しますか？ 現在の状態は直前の変更として保持します。'))return;undoState=localStorage.getItem(KEY);db=candidate;db.expenses=Array.isArray(db.expenses)?db.expenses:[];db.timeLogs=Array.isArray(db.timeLogs)?db.timeLogs:[];db.references=Array.isArray(db.references)?db.references:[];save();render();toast('履歴を復元しました')}const project=id=>db.projects.find(p=>p.id===id);const progress=id=>{let t=db.tasks.filter(x=>x.projectId===id);return t.length?Math.round(t.filter(x=>x.done).length/t.length*100):0};const dateText=d=>d?esc(d):'未設定';const due=d=>d&&!isNaN(Date.parse(d))&&d<today();const daysUntil=d=>{if(!d)return null;const a=new Date(today()+'T12:00:00'),b=new Date(d+'T12:00:00');return Math.round((b-a)/86400000)};function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2300)}const sortTasks=arr=>[...arr].sort((a,b)=>{if(taskSort==='manual')return (Number(a.order)||0)-( async function compressReference(file){if(!file.type.startsWith('image/')||file.size>15000000)throw Error('image');const bitmap=await createImageBitmap(file);const scale=Math.min(1,900/Math.max(bitmap.width,bitmap.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close();return c.toDataURL('image/jpeg',.68)}
function settings(){return `<div class="heading"><h1>設定・バックアップ</h1></div><div class="grid"><section class="card"><h2>JSONバックアップ</h2><p class="muted">制作データをファイルとして保存・復元できます。参考資料として登録した軽量化画像もJSONに含まれます。バックアップには個人情報が含まれる場合があります。</p><div class="actions"><button class="btn primary" data-export>バックアップを保存</button><button class="btn" data-import>バックアップを復元</button></div><input class="sr" type="file" id="importFile" accept="application/json,.json"></section><section class="card"><h2>変更履歴（最大4件）</h2><p class="muted">変更前のデータをこのブラウザ内に一時保存します。画像が多い場合や容量不足の場合は履歴が作成されません。端末の故障やブラウザデータ削除には備えられないため、JSONバックアップも保存してください。</p><div class="actions"><button class="btn" type="button" onclick="window.creatorUndo?.()">↶ 直前の変更を取り消す</button></div>${getHistory().slice().reverse().map((h,i)=>`<div class="history-row"><span>${esc(new Date(h.at).toLocaleString('ja-JP'))}</span><button class="btn" data-restore-history="${getHistory().length-1-i}">この時点に戻す</button></div>`).join('')||'<p class="muted">まだ履歴はありません</p>'}</section><section class="card"><h2>データの保存について</h2><p class="muted">データはこのブラウザ内に保存されます。ログインやクラウド同期はありません。端末変更・ブラウザデータ削除に備えて、定期的にバックアップしてください。</p><button class="btn danger" data-clear>すべてのデータを削除</button></section></div>`}function safeUrl(s){try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}

function timelog(){const logs=[...db.timeLogs].filter(x=>timeProject==='all'||x.projectId===timeProject).sort((a,b)=>b.date.localeCompare(a.date));const total=logs.reduce((a,b)=>a+(Number(b.minutes)||0),0);const weekStart=new Date(today()+'T12:00:00');weekStart.setDate(weekStart.getDate()-6);const week=logs.filter(x=>x.date>=weekStart.toLocaleDateString('sv-SE')).reduce((a,b)=>a+Number(b.minutes||0),0);return `<div class="heading"><h1>制作時間</h1><button class="btn primary" data-add-time="">＋ 時間を記録</button></div><div class="grid stats"><div class="card"><span class="muted">表示中の合計</span><strong>${minutesText(total)}</strong></div><div class="card"><span class="muted">直近7日間</span><strong>${minutesText(week)}</strong></div><div class="card"><span class="muted">記録件数</span><strong>${logs.length}</strong></div></div><p class="muted">休んだ日は空白のままで大丈夫。制作を続けるための記録です。</p><div class="toolbar"><select id="timeFilter" aria-label="プロジェクトで絞り込み"><option value="all">すべての作品</option>${db.projects.map(p=>`<option value="${esc(p.id)}" ${timeProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button class="btn" data-export-time>CSV出力</button></div><section class="card"><div class="stack">${logs.length?logs.map(x=>`<article class="item"><div class="row"><h3>${esc(x.date)} ・ ${minutesText(x.minutes)}</h3><span class="pill">${esc(project(x.projectId)?.name||'未分類')}</span></div><p class="note">${esc(x.note||'')}</p><div class="actions"><button class="btn" data-edit-time="${esc(x.id)}">編集</button><button class="btn danger" data-delete-time="${esc(x.id)}">削除</button></div></article>`).join(''):empty('制作時間の記録はまだありません。')}</div></section>`}

function timeline(){const dated=db.tasks.filter(t=>t.start||t.due).sort((a,b)=>(a.start||a.due).localeCompare(b.start||b.due));const base=new Date(today()+'T12:00:00');base.setDate(1);const days=42;const start=base.toLocaleDateString('sv-SE');const end=new Date(base);end.setDate(end.getDate()+days-1);const endS=end.toLocaleDateString('sv-SE');const visible=dated.filter(t=>(t.start||t.due)<=endS&&(t.due||t.start)>=start);const labels=Array.from({length:days},(_,i)=>{const d=new Date(base);d.setDate(d.getDate()+i);return d.toLocaleDateString('sv-SE')});return `<div class="heading"><h1>制作工程表</h1><button class="btn primary" data-add-task="">＋ タスク</button></div><p class="muted">今月から42日間の予定を表示します。タスク編集で「開始予定日」と「締切」を設定すると期間が見えます。</p><section class="card"><div class="timeline-scroll"><div class="timeline-grid"><div class="timeline-name muted">工程・タスク</div>${labels.map((d,i)=>`<div class="timeline-day ${d===today()?'now':''}" title="${d}">${i%7===0||d.endsWith('-01')?Number(d.slice(-2)):''}</div>`).join('')}${visible.map(t=>{let a=Math.max(0,labels.indexOf(t.start||t.due));let b=labels.indexOf(t.due||t.start);if(b<0)b=days-1;if(a<0)a=0;if(b<a)b=a;return `<button class="timeline-name tl-task" data-edit-task="${esc(t.id)}" title="編集：${esc(t.title)}">${esc(t.title)}<small>${esc(project(t.projectId)?.name||'')}</small></button><div class="timeline-track">${labels.map((d,i)=>`<span class="timeline-cell ${d===today()?'now':''}"></span>`).join('')}<span class="timeline-bar ${t.done?'finished':''}" style="left:${a/days*100}%;width:${(b-a+1)/days*100}%" title="${esc(t.title)}：${esc(t.start||t.due)} 〜 ${esc(t.due||t.start)}"></span></div>`}).join('')}</div></div>${visible.length?'':empty('この期間に予定のあるタスクはありません。')}</section><p class="muted mini">工程表のバーは開始予定日〜締切を示します。実際の作業時間は「制作時間」で記録できます。</p>`}
